name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: doc_intel
          POSTGRES_PASSWORD: doc_intel
          POSTGRES_DB: doc_intel
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U doc_intel" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://doc_intel:doc_intel@localhost:5433/doc_intel
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-rus tesseract-ocr-ukr tesseract-ocr-kat
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - run: make test
