name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - run: make test
