# The pipeline configuration under comparison. `Pipeline.from_config("configs/default.yaml")`.
# Copy this file to try another provider, model, or extraction strategy; evals report per config.
name: default

llm:
  provider: ollama          # anthropic | openai | ollama (keys and hosts come from .env)
  model: qwen2.5vl:3b

ocr:
  fallback_below: 60        # mean Tesseract confidence (0-100) under which the vision model transcribes
  psm: 3                    # Tesseract page segmentation mode
  vision_model: null        # null = the llm model above

extraction:
  strategy: both            # text | image | both
  max_tokens: 4096
  max_repairs: 1            # validation-feedback rounds before giving up

embeddings:
  provider: ollama          # ollama | openai
  model: nomic-embed-text
  dimensions: 768           # must match vector(768) in db/schema.sql

rag:
  k: 5                      # excerpts handed to the answer model
  candidates: 20            # fused candidates considered before rerank
  scope_by_number: true     # restrict search to the invoice a question names
  rerank: false             # one extra LLM call per question; measured by make eval-answers
