services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: doc_intel
      POSTGRES_PASSWORD: doc_intel
      POSTGRES_DB: doc_intel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doc_intel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
