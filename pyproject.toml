[project]
name = "daysync-doc-intel"
version = "0.0.1"
description = "Document intelligence for supplier invoices and contracts: OCR, LLM extraction, validation, RAG, evals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=1.4,<2",
  "fastapi>=0.141,<1",
  "ollama>=0.6,<1",
  "openai>=3.8,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "python-multipart>=0.0.32",
  "uvicorn[standard]>=0.52,<1",
]

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16.6",
  "mypy>=2.3,<3",
  "httpx2>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_intel"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
