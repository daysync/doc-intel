[project]
name = "daysync-doc-intel"
version = "0.0.1"
description = "Document intelligence for supplier invoices and contracts: OCR, LLM extraction, validation, RAG, evals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.13,<3",
]

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
