[project]
name = "daysync-doc-intel"
version = "0.0.1"
description = "Document intelligence for supplier invoices and contracts: OCR, LLM extraction, validation, RAG, evals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=1.4,<2",
  "fastapi>=0.141,<1",
  "numpy>=2.5,<3",
  "ollama>=0.6,<1",
  "openai>=3.8,<4",
  "opencv-python-headless>=5,<6",
  "pillow>=12,<13",
  "pillow-heif>=1.6,<2",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "pypdfium2>=5,<6",
  "pytesseract>=0.3.13,<1",
  "python-multipart>=0.0.32",
  "pyyaml>=6,<7",
  "reportlab>=5,<6",
  "uvicorn[standard]>=0.52,<1",
]

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16.6",
  "mypy>=2.3,<3",
  "httpx2>=0.1",
  "types-pyyaml>=6.0.12.20260815",
  "types-reportlab>=4.5.1.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_intel"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
# Multilingual sample text legitimately mixes scripts; RUF001 sees look-alike letters.
"src/doc_intel/dataset/content.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*", "pillow_heif", "pillow_heif.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
